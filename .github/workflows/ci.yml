name: aecp-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,storage]"

      - name: Lint (ruff)
        run: ruff check aecp tests

      - name: Typecheck (mypy)
        run: mypy aecp

      - name: Tests (unit, non-integration)
        run: pytest -m "not integration"

      - name: Memory-plane benchmark evidence
        run: python -m aecp.memory.bench --rows 1000000