#cloud-config
# AECP bootstrap - provider-neutral cloud-init user-data.
# Works on AWS (user-data), Azure (customData), GCP (startup-script), and
# Oracle Cloud (user-data) Ubuntu images.
package_update: true
packages:
  - git
  - curl

runcmd:
  - curl -fSL https://raw.githubusercontent.com/nrupala/aecp/main/deploy/versions.env -o /tmp/aecp-versions.env || true
  - git clone https://github.com/nrupala/aecp.git /root/aecp
  - bash -c 'cd /root/aecp && nohup bash deploy/provision/bootstrap.sh > /var/log/aecp-bootstrap.log 2>&1 &'

final_message: |
  AECP bootstrap started in background; follow with:
    tail -f /var/log/aecp-bootstrap.log
  When complete, verify with: /opt/aecp/venv/bin/aecpctl health
  Gateway:   http://<host>:8847/healthz
  Zeppelin:  http://<host>:8083
  Superset:  http://<host>:8088  (admin password in /var/lib/aecp/superset/admin.txt)
  Guacamole: http://<host>:8090/guacamole  (aecpadmin, password in /var/lib/aecp/guacamole/credentials.txt)