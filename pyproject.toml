[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aecp"
version = "0.1.0"
description = "AECP: The 100% Apache Enterprise Computing Platform - deployable system model for any cloud"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AECP Contributors" }]
keywords = ["apache", "enterprise", "streaming", "ozone", "iceberg", "pulsar", "flink", "solr", "arrow", "zeppelin", "superset", "guacamole"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15.0",
    "requests>=2.31",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
streaming = ["pulsar-client>=3.5"]
storage = ["pyiceberg[s3fs,sql-sqlite]>=0.8"]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "types-requests",
]

[project.scripts]
aecpctl = "aecp.cli.main:main"
aecp-gateway = "aecp.gateway.app:serve"

[tool.hatch.build.targets.wheel]
packages = ["aecp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "pulsar.*", "pyiceberg.*", "fastapi.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires live services (deselect with -m 'not integration')",
]